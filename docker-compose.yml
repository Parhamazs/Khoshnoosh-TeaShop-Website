version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: khoshnoosh_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-khoshnoosh_db}
      POSTGRES_USER: ${POSTGRES_USER:-khoshnoosh_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-khoshnoosh_secure_pass_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-khoshnoosh_user} -d ${POSTGRES_DB:-khoshnoosh_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: khoshnoosh_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: khoshnoosh_backend
    restart: always
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             python manage.py shell < seed_data.py &&
             gunicorn --bind 0.0.0.0:8000 --workers 3 --timeout 120 khoshnoosh.wsgi:application"
    environment:
      DEBUG: "True"
      SECRET_KEY: ${SECRET_KEY:-django-insecure-khoshnoosh-herbal-tea-secret-key-prod-2026}
      POSTGRES_DB: ${POSTGRES_DB:-khoshnoosh_db}
      POSTGRES_USER: ${POSTGRES_USER:-khoshnoosh_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-khoshnoosh_secure_pass_2026}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    volumes:
      - ./backend:/app
      - backend_static:/app/staticfiles
      - backend_media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: khoshnoosh_celery
    restart: always
    command: celery -A khoshnoosh worker -l info
    environment:
      SECRET_KEY: ${SECRET_KEY:-django-insecure-khoshnoosh-herbal-tea-secret-key-prod-2026}
      POSTGRES_DB: ${POSTGRES_DB:-khoshnoosh_db}
      POSTGRES_USER: ${POSTGRES_USER:-khoshnoosh_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-khoshnoosh_secure_pass_2026}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    volumes:
      - ./backend:/app
      - backend_media:/app/media
    depends_on:
      - backend
      - redis

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: khoshnoosh_celery_beat
    restart: always
    command: celery -A khoshnoosh beat -l info
    environment:
      SECRET_KEY: ${SECRET_KEY:-django-insecure-khoshnoosh-herbal-tea-secret-key-prod-2026}
      POSTGRES_DB: ${POSTGRES_DB:-khoshnoosh_db}
      POSTGRES_USER: ${POSTGRES_USER:-khoshnoosh_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-khoshnoosh_secure_pass_2026}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    volumes:
      - ./backend:/app
    depends_on:
      - backend
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: khoshnoosh_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: khoshnoosh_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - backend_static:/app/static:ro
      - backend_media:/app/media:ro
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  redis_data:
  backend_static:
  backend_media:
